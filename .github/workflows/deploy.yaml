name: deploy NodeJS Application to AWS VPS

on: 
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ec2-13-204-226-21.ap-south-1.compute.amazonaws.com
          username: root
          key: ${{secrets.NODEAPPSECRETKEY}}
          script: | 
            cd /home/deploy/docker-dummy
            git pull
            docker compose up -d --build